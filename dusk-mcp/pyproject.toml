[project]
name = "dusk-mcp"
version = "0.1.0"
description = "MCP Server for Dusk Agent tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=0.1.0",
    "tweepy>=4.14.0",
    "tavily-python>=0.3.0",
]

[project.scripts]
dusk-mcp = "dusk_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
